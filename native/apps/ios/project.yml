name: VCPNative
options:
  bundleIdPrefix: org.vcptoolbox
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../../generated/swift"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/../../generated/swift/VcpMobileNativeFFI.modulemap"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/../../target/${VCP_RUST_SIM_TARGET}/release"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/../../target/aarch64-apple-ios/release"
    OTHER_LDFLAGS: "$(inherited) -lvcp_mobile_native"
targets:
  VCPNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../../generated/swift/VcpMobileNative.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vcptoolbox.nativeclient.dev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VCP 原生开发版
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  VCPNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: VCPNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VCPNative:
    build:
      targets:
        VCPNative: all
    test:
      targets:
        - VCPNativeUITests
