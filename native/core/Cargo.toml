[package]
name = "vcp-mobile-native-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "vcp_mobile_native"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
uniffi = { version = "=0.29.4", features = ["tokio"] }
thiserror = "=2.0.12"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.19.1"
